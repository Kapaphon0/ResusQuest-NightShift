    <script>
      // Automatically redirect to trailing-slash URL on GitHub Pages subpaths
      // so relative assets (./assets/...) resolve properly and avoid 404 blank pages.
      (function () {
        var loc = window.location;
        if (loc.pathname && !loc.pathname.endsWith('/') && !loc.pathname.split('/').pop().includes('.')) {
          loc.replace(loc.origin + loc.pathname + '/' + loc.search + loc.hash);
        }
      })();
    </script>
