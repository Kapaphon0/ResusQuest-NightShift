<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResusQuest: The Night Shift</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var path = window.location.pathname;
      var origin = window.location.origin;
      // Get the repository subpath if running under username.github.io/repo-name/
      var parts = path.split('/').filter(Boolean);
      var repoBase = parts.length > 0 ? '/' + parts[0] + '/' : '/';
      window.location.replace(origin + repoBase);
    </script>
  </head>
  <body>
    <div style="font-family: system-ui, sans-serif; text-align: center; padding: 40px;">
      <h2>Redirecting to ResusQuest...</h2>
    </div>
  </body>
</html>
