<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResusQuest: The Night Shift</title>
    <script>
      // Single Page App redirect for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var origin = window.location.origin;

        // Never redirect for missing static files (js, css, images, etc.) to prevent infinite reload loops
        if (/\.[a-zA-Z0-9]+$/.test(path)) {
          return;
        }

        var isGithubIo = window.location.hostname.endsWith('github.io');
        var parts = path.split('/').filter(Boolean);

        // If on user.github.io/repo-name/
        var repoBase = '/';
        if (isGithubIo && parts.length > 0) {
          repoBase = '/' + parts[0] + '/';
        }

        // Only redirect if we are not already at repoBase
        if (path !== repoBase) {
          window.location.replace(origin + repoBase);
        }
      })();
    </script>
  </head>
  <body>
    <div style="font-family: system-ui, sans-serif; text-align: center; padding: 40px;">
      <h2>Redirecting to ResusQuest...</h2>
    </div>
  </body>
</html>
